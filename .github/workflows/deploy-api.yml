name: Deploy API to Droplet

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'Dockerfile.api'
      - 'package.json'
      - 'bun.lock'

jobs:
  # The droplet pulls and rebuilds from main, so a red main would ship straight
  # to production. Gate it.
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --cpu='*' --os='*'

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  image:
    name: API image builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f Dockerfile.api -t tnp-api:deploy-check .

  deploy:
    needs: [verify, image]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/tnp || cd /opt/tnp || cd /app
            git pull origin main
            docker build -f Dockerfile.api -t tnp-api .
            docker stop tnp-api || true
            docker rm tnp-api || true
            docker run -d \
              --name tnp-api \
              --restart unless-stopped \
              --network host \
              --env-file .env \
              tnp-api
