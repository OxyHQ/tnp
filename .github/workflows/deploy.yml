name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  # Deploys used to run unconditionally on every push to main with nothing
  # verifying the code first. The gates run here so a red main cannot ship.
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --cpu='*' --os='*'

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --filter '@tnp/web'

      - name: Build
        run: cd apps/web && bun run build
        env:
          VITE_API_URL: https://api.tnp.network

      # DEPLOYED WITH `bunx wrangler@4`, NOT `cloudflare/wrangler-action`, which
      # is forbidden fleet-wide (~/Oxy/docs/infra-and-deploys.md). The action
      # installs its own wrangler mid-deploy (`bun i wrangler@...`), which fails
      # intermittently with `error: Fail extracting tarball for "wrangler"` and
      # publishes nothing. Pinned to a major so the deploy path cannot change with
      # no diff to show for it; wrangler reads its credentials from the
      # environment, hence `env:`.
      - name: Deploy to Cloudflare Pages
        run: bunx wrangler@4 pages deploy apps/web/dist --project-name=tnp --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
