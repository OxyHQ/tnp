name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  # Deploys used to run unconditionally on every push to main with nothing
  # verifying the code first. The gates run here so a red main cannot ship.
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --cpu='*' --os='*'

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --filter '@tnp/web'

      - name: Build
        run: cd apps/web && bun run build
        env:
          VITE_API_URL: https://api.tnp.network

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=tnp --branch=main
