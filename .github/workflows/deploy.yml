name: Deploy to Cloudflare Pages
# The commit under release, in the run's title: the scope step reads it back
# from earlier runs to find the last commit that actually deployed.
run-name: Deploy web ${{ github.event.workflow_run.head_sha || github.sha }}

# Releases the web app only after CI succeeded on a push to main, for that
# exact commit. CI is what typechecks, tests, runs the PostgreSQL suite and
# builds the images; this workflow used to repeat typecheck and test in a job
# of its own, and now starts from CI's verdict instead. A red main never
# starts a release here. CI also publishes the AWS images (its
# publish_aws_images job, through deploy-aws.yml), so the web never ships for a
# commit whose image publish failed. Only this workflow deploys the web;
# deploy-aws.yml publishes images and deploys nothing.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed current main SHA
        required: true
        type: string
      ci_run_id:
        description: Successful push CI run for this exact main SHA
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  # The commit CI tested on `workflow_run`; the dispatched commit otherwise.
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: >-
      vars.OXY_1519_ROLLOUT_HOLD != 'true' && (
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # On the job, not the workflow: a run that the guard above skips (a red
    # CI) never enters the lane, so it cannot displace
    # a pending release. Releases run one at a time and are never cancelled: a
    # rollout interrupted half-way is worse than a late one. A newer pending
    # release may replace an older pending one, which is safe because the
    # scope below diffs from the last commit that actually DEPLOYED, so the
    # newer release carries the older one's changes.
    concurrency:
      group: deploy-tnp-pages
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # The scope diff runs from the last deployed commit to this one.
          fetch-depth: 0
          persist-credentials: false

      # workflow_run has no `paths:`, so the web is released only when this
      # commit, or any commit since the last successful release, changed what
      # the site is built from: apps/web, the workspace packages it imports,
      # the install graph and this workflow. When the last release cannot be
      # found or is not an ancestor, it deploys. A manual dispatch always
      # deploys.
      #
      # A commit main has moved past is held ONLY when a newer main commit has
      # a CI run of its own (queued, running or green): that run's release
      # carries this one, and holding is what stops a slow CI for an older
      # commit rolling the site back. A newer commit with no CI run at all (a
      # bot merge with GITHUB_TOKEN starts no workflow) would never release
      # anything, so then this, the newest CI-tested commit, deploys.
      - name: Decide whether this commit changes the site
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          decide() {
            echo "deploy=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
          }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            decide true "Manual release of $DEPLOY_SHA."
            exit 0
          fi
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$main_sha" != "$DEPLOY_SHA" ]; then
            read -r status newer < <(gh api "repos/$GITHUB_REPOSITORY/compare/$DEPLOY_SHA...$main_sha" \
              --jq '"\(.status) \([.commits[].sha] | join(","))"')
            if [ "$status" != ahead ]; then
              echo "::error::$DEPLOY_SHA is not behind main ($main_sha): compare says $status."
              exit 1
            fi
            for sha in ${newer//,/ }; do
              runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&branch=main" \
                --jq '[.workflow_runs[] | select(.status != "completed" or .conclusion == "success")] | length')
              if [ "$runs" != 0 ]; then
                decide false "::notice::Newer main commit $sha has its own CI run; its release carries $DEPLOY_SHA."
                exit 0
              fi
            done
            echo "No main commit after $DEPLOY_SHA has a CI run of its own; deploying it as the newest CI-tested commit."
          fi

          # The last release is the newest successful run of this workflow
          # whose "Deploy to Cloudflare Pages" step succeeded. The commit it
          # deployed is in its title (run-name above); a run from before
          # run-name existed deployed its head_sha.
          base=''
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID)
              | \"\(.id) \((.display_title | capture(\"^Deploy web (?<s>[0-9a-f]{40})$\") | .s) // .head_sha)\"" || true)
          while read -r id sha; do
            [ -n "$id" ] || continue
            deployed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" < /dev/null \
              --jq '[.jobs[].steps[]? | select(.name == "Deploy to Cloudflare Pages" and .conclusion == "success")] | length' || echo 0)
            if [ "$deployed" != 0 ]; then
              base=$sha
              break
            fi
          done <<< "$runs"

          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" "$DEPLOY_SHA" 2>/dev/null; then
            decide true "No earlier release found on this history (base: ${base:-none}); deploying."
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$DEPLOY_SHA")
          site=$(grep -E '^(apps/web/|packages/(crypto|namespace|shared-types)/|package\.json$|bun\.lock$|bunfig\.toml$|\.github/workflows/deploy\.yml$)' <<< "$changed" || true)
          if [ -n "$site" ]; then
            decide true "Site inputs changed since $base:"$'\n'"$site"
          else
            decide false "::notice::Nothing the site is built from changed since the last release ($base); not deploying."
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.scope.outputs.deploy == 'true'
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: steps.scope.outputs.deploy == 'true'
        run: bun install --filter '@tnp/web' --frozen-lockfile

      - name: Build
        if: steps.scope.outputs.deploy == 'true'
        run: cd apps/web && bun run build
        env:
          VITE_API_URL: https://api.tnp.network

      # A manual release is admitted only for the exact current main SHA with
      # a successful push CI run for it, checked once, right before deploying.
      - name: Verify manual release source and CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_CI_RUN_ID: ${{ inputs.ci_run_id }}
          EXPECTED_CI_WORKFLOW: .github/workflows/ci.yml
          OXY_1519_ROLLOUT_HOLD: ${{ vars.OXY_1519_ROLLOUT_HOLD }}
        run: python3 .github/scripts/verify-manual-frontend.py

      # DEPLOYED WITH THE LOCKED WRANGLER, NOT `cloudflare/wrangler-action`,
      # which is forbidden fleet-wide (~/Oxy/docs/infra-and-deploys.md): it
      # installs its own wrangler mid-deploy (`bun i wrangler@...`), which fails
      # intermittently with `error: Fail extracting tarball for "wrangler"` and
      # publishes nothing. Nor `bunx wrangler@4`, which fetched whatever 4.x was
      # newest at deploy time, outside bun.lock, into the one step holding
      # CLOUDFLARE_API_TOKEN. wrangler is an exact devDependency of @tnp/web,
      # installed above from the frozen lockfile, and run from node_modules/.bin
      # so a missing binary fails the step instead of downloading one. Bump it
      # by changing apps/web/package.json and bun.lock in a reviewed PR.
      # wrangler reads its credentials from the environment, hence `env:`.
      # The scope step looks this step up BY NAME to find the last release.
      - name: Deploy to Cloudflare Pages
        if: steps.scope.outputs.deploy == 'true'
        run: ./node_modules/.bin/wrangler pages deploy apps/web/dist --project-name=tnp --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
