name: Seldon race retry

# A pull request's first CI attempt that failed with a failed job on the
# seldon-ci pool re-runs its failed jobs once, hosted: the raced lanes go to
# Seldon only on run_attempt 1 (OxyHQ/oxy docs/engineering/build-and-deploy.md,
# CI on Seldon). The house's ISP gateway can fail a Seldon job's checkout or
# upload where hosted would pass; a genuine failure fails again on hosted.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

# This repository requires every action pinned to a full commit SHA, and the
# OxyHQ/oxy reusable workflows call the seldon-race action at @main, which the
# policy refuses (probe run 45902589840). So the retry runs only once the race
# is turned on, and the race cannot be turned on until that is resolved.
jobs:
  retry:
    if: vars.CI_SELDON_RACE == 'true' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    permissions:
      actions: write
    uses: OxyHQ/oxy/.github/workflows/seldon-race-retry.yml@6833cdbbf37623bdc893a2a8e7015e900c07201e # main
