# Publish TNP API, DNS and relay images to ECR in us-west-2.
#
# This workflow deliberately does NOT deploy. Each ECS service is activated by
# a separate reviewed infrastructure change that pins the digest printed here.
# For the relay that change also sets RELAY_ENDPOINT and RELAY_KEY_SEED, lists
# it in the API's TNP_OXY_RELAYS and scales it up; until then a published relay
# image serves nothing (docs/architecture/relays.md §8). Publishing a reviewed
# image and activating traffic are different operations and must never be
# coupled implicitly.
#
# Called by ci.yml only after typecheck, tests, and both Docker builds pass for
# the exact main commit. workflow_dispatch is an operational retry path, not a
# way to publish an unreviewed branch: the preflight refuses anything but main.

name: Publish AWS images

on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-tnp-aws-images
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  SOURCE_SHA: ${{ github.sha }}

jobs:
  publish:
    name: Publish ${{ matrix.app }} linux/arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # No `dockerfile` here: each is a reviewed recipe, so its
          # Dockerfile, context and target come only from the guard below,
          # which verified them.
          - app: tnp-api
          - app: tnp-dns
          - app: tnp-relay
    steps:
      - name: Validate the immutable main source
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::AWS images may only be published from refs/heads/main.'
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::SOURCE_SHA is not a full lowercase Git commit SHA.'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # `--cache-from/--cache-to type=gha` below need the Actions runtime token
      # and cache URL, which GitHub gives to JavaScript actions and NOT to `run:`
      # steps; without them buildx skips the cache silently. This workflow only
      # publishes from refs/heads/main (see the preflight above), so
      # pull-request code never writes these cache scopes.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # A full commit SHA is the only tag. There is intentionally no :latest:
      # existing ECS definitions still reference it, and moving that mutable
      # tag would make a later scale-up select an artefact no reviewed infra
      # change named. The promotion PR must pin the digest printed below.
      #
      # The ECR repositories reject tag overwrites. This explicit
      # lookup produces a clearer failure and the concurrency group prevents
      # two runs racing through it for the same commit.
      # Every image builds only what the owner reviewed. Its Dockerfile,
      # context, target and both .dockerignore files are hashed and compared
      # with the ONE pin in .github/scripts/reviewed-images.json; a mismatch
      # stops here, before anything is built or pushed. The Dockerfile,
      # context, target and label values below are this step's outputs, so the
      # build cannot use a different file than the one checked, and no hash is
      # spelled out in this workflow to drift from the pin. A matrix leg with
      # no recipe is refused rather than built. CI runs the same check on every
      # pull request (`reviewed-image.py check`, AWS images build).
      - name: Refuse unreviewed image build inputs
        id: reviewed
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          case "$APP" in
            tnp-api) python3 -B .github/scripts/reviewed-image.py guard --recipe tnp-api ;;
            tnp-dns) python3 -B .github/scripts/reviewed-image.py guard --recipe tnp-dns ;;
            tnp-relay) python3 -B .github/scripts/reviewed-image.py guard --recipe tnp-relay ;;
            *)
              echo "::error::$APP has no reviewed recipe; refusing to build it."
              exit 1
              ;;
          esac

      - name: Build and publish immutable SHA image
        id: image
        env:
          APP: ${{ matrix.app }}
          DOCKERFILE: ${{ steps.reviewed.outputs.dockerfile }}
          CONTEXT: ${{ steps.reviewed.outputs.context }}
          TARGET: ${{ steps.reviewed.outputs.target }}
          REVIEWED_REPOSITORY: ${{ steps.reviewed.outputs.ecr_repository }}
          SOURCE_TREE: ${{ steps.reviewed.outputs.source_tree }}
          BUILD_INPUTS_SHA256: ${{ steps.reviewed.outputs.build_inputs_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_INPUTS_SHA256" =~ ^[0-9a-f]{64}$ ]] || [ -z "$DOCKERFILE" ] || [ -z "$CONTEXT" ]; then
            echo "::error::$APP reached the build without its reviewed-image guard."
            exit 1
          fi
          repository="oxy/$APP"
          if [ "$REVIEWED_REPOSITORY" != "$repository" ]; then
            echo "::error::$APP would publish to $repository, but its reviewed recipe names $REVIEWED_REPOSITORY."
            exit 1
          fi
          target_args=()
          if [ -n "$TARGET" ]; then
            target_args=(--target "$TARGET")
          fi
          image="$ECR_REGISTRY/$repository:$SOURCE_SHA"
          lookup=$(aws ecr batch-get-image --repository-name "$repository" \
            --image-ids imageTag="$SOURCE_SHA" --output json)
          existing_digest=$(LOOKUP="$lookup" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["LOOKUP"])
          images = payload.get("images", [])
          failures = payload.get("failures", [])
          if images and not failures:
              print(images[0]["imageId"]["imageDigest"])
          elif not images and len(failures) == 1 and failures[0].get("failureCode") == "ImageNotFound":
              print("missing")
          else:
              print("::error::ECR lookup did not prove an existing image or ImageNotFound")
              raise SystemExit(1)
          PY
          )

          if [[ "$existing_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The immutable SHA tag already exists; refusing to overwrite it."
            digest="$existing_digest"
          elif [ "$existing_digest" = "missing" ]; then
            # --load puts the image in the local store exactly as the plain
            # `docker build` did, so the inspect and push below are unchanged.
            # --provenance=false keeps it a single-platform image manifest,
            # which the registry verification step reads `config` from.
            docker buildx build --platform linux/arm64 -f "$DOCKERFILE" \
              --cache-from "type=gha,scope=$APP" \
              --cache-to "type=gha,scope=$APP,mode=max" \
              --provenance=false \
              --load \
              --label "org.opencontainers.image.revision=$SOURCE_SHA" \
              --label 'org.opencontainers.image.source=https://github.com/OxyHQ/tnp' \
              --label "io.oxy.source.tree=$SOURCE_TREE" \
              --label "io.oxy.build-inputs.sha256=$BUILD_INPUTS_SHA256" \
              "${target_args[@]}" \
              -t "$image" "$CONTEXT"
            architecture=$(docker image inspect "$image" --format '{{.Architecture}}')
            if [ "$architecture" != "arm64" ]; then
              echo "::error::local image architecture is $architecture, expected arm64"
              exit 1
            fi
            docker push "$image"
            digest=$(aws ecr batch-get-image --repository-name "$repository" \
              --image-ids imageTag="$SOURCE_SHA" \
              --query 'images[0].imageId.imageDigest' --output text)
          else
            echo '::error::ECR returned an invalid existing image digest.'
            exit 1
          fi

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::ECR did not return an exact sha256 image digest.'
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Verify the registry artefact, not only the local build flag. This also
      # covers the idempotent retry path where the SHA tag already existed.
      - name: Verify the published registry artefact
        env:
          APP: ${{ matrix.app }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          repository="oxy/$APP"
          manifest=$(aws ecr batch-get-image --repository-name "$repository" \
            --image-ids imageDigest="$DIGEST" \
            --query 'images[0].imageManifest' --output text)
          config_digest=$(MANIFEST="$manifest" python3 - <<'PY'
          import json
          import os

          print(json.loads(os.environ["MANIFEST"])["config"]["digest"])
          PY
          )
          config_url=$(aws ecr get-download-url-for-layer --repository-name "$repository" \
            --layer-digest "$config_digest" --query downloadUrl --output text)
          read -r architecture revision < <(curl -fsS "$config_url" | python3 -c '
          import json
          import sys

          image = json.load(sys.stdin)
          labels = image.get("config", {}).get("Labels") or {}
          print(image.get("architecture", "missing"), labels.get("org.opencontainers.image.revision", "missing"))
          ')
          if [ "$architecture" != "arm64" ]; then
            echo "::error::published image architecture is $architecture, expected arm64"
            exit 1
          fi
          if [ "$revision" != "$SOURCE_SHA" ]; then
            echo '::error::published image is not labelled for the exact source commit'
            exit 1
          fi
          printf -- '- `%s` -> `%s@%s` (`linux/arm64`)\n' \
            "$SOURCE_SHA" "$ECR_REGISTRY/$repository" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      # No ECS update-service, task-definition registration, desired-count
      # mutation, SSM write, or traffic probe belongs in an artefact publisher.
      # Activation is a later reviewed oxy-infra change using the digest above.
