# Publish the dormant TNP API and DNS images to ECR in us-west-2.
#
# This workflow deliberately does NOT deploy. The three ECS services remain at
# desiredCount 0 until their separate infrastructure and security promotion
# gates pass. Publishing a reviewed image and activating traffic are different
# operations and must never be coupled implicitly.
#
# Called by ci.yml only after typecheck, tests, and both Docker builds pass for
# the exact main commit. workflow_dispatch is an operational retry path, not a
# way to publish an unreviewed branch: the preflight refuses anything but main.

name: Publish AWS images

on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-tnp-aws-images
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  CLUSTER: oxy-cluster
  SOURCE_SHA: ${{ github.sha }}

jobs:
  preflight:
    name: Prove every TNP service is parked
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate the immutable main source
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::AWS images may only be published from refs/heads/main.'
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::SOURCE_SHA is not a full lowercase Git commit SHA.'
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # This is a read-only guard. It never scales a service. Requiring all
      # three names also makes a missing/renamed service fail closed instead of
      # treating an empty AWS response as proof that nothing is running.
      - name: Assert API, DNS, and Relay are all at zero
        run: |
          set -euo pipefail
          state=$(aws ecs describe-services --cluster "$CLUSTER" \
            --services tnp-api tnp-dns tnp-relay --output json)
          SERVICE_STATE="$state" python3 - <<'PY'
          import json
          import os

          expected = {"tnp-api", "tnp-dns", "tnp-relay"}
          payload = json.loads(os.environ["SERVICE_STATE"])
          services = {item["serviceName"]: item for item in payload.get("services", [])}
          failures = payload.get("failures", [])
          if failures or set(services) != expected:
              print("::error::could not resolve the exact three TNP ECS services")
              raise SystemExit(1)
          active = {
              name: service.get("desiredCount")
              for name, service in services.items()
              if service.get("desiredCount") != 0
          }
          if active:
              print(f"::error::TNP image publication requires desiredCount 0: {active}")
              raise SystemExit(1)
          print("tnp-api, tnp-dns, and tnp-relay are all parked at desiredCount 0")
          PY

  publish:
    name: Publish ${{ matrix.app }} linux/arm64
    needs: preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: tnp-api
            dockerfile: Dockerfile.api
          - app: tnp-dns
            dockerfile: Dockerfile.dns
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # A full commit SHA is the only tag. There is intentionally no :latest:
      # existing ECS definitions still reference it, and moving that mutable
      # tag would make a later scale-up select an artefact no reviewed infra
      # change named. The promotion PR must pin the digest printed below.
      #
      # ECR is currently tag-mutable, so the workflow enforces immutability by
      # refusing to push over a SHA that already exists. The concurrency group
      # prevents two runs racing through this check for the same commit.
      - name: Build and publish immutable SHA image
        id: image
        env:
          APP: ${{ matrix.app }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          repository="oxy/$APP"
          image="$ECR_REGISTRY/$repository:$SOURCE_SHA"
          lookup=$(aws ecr batch-get-image --repository-name "$repository" \
            --image-ids imageTag="$SOURCE_SHA" --output json)
          existing_digest=$(LOOKUP="$lookup" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["LOOKUP"])
          images = payload.get("images", [])
          failures = payload.get("failures", [])
          if images and not failures:
              print(images[0]["imageId"]["imageDigest"])
          elif not images and len(failures) == 1 and failures[0].get("failureCode") == "ImageNotFound":
              print("missing")
          else:
              print("::error::ECR lookup did not prove an existing image or ImageNotFound")
              raise SystemExit(1)
          PY
          )

          if [[ "$existing_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The immutable SHA tag already exists; refusing to overwrite it."
            digest="$existing_digest"
          elif [ "$existing_digest" = "missing" ]; then
            docker build --platform linux/arm64 -f "$DOCKERFILE" \
              --label "org.opencontainers.image.revision=$SOURCE_SHA" \
              --label 'org.opencontainers.image.source=https://github.com/OxyHQ/tnp' \
              -t "$image" .
            architecture=$(docker image inspect "$image" --format '{{.Architecture}}')
            if [ "$architecture" != "arm64" ]; then
              echo "::error::local image architecture is $architecture, expected arm64"
              exit 1
            fi
            docker push "$image"
            digest=$(aws ecr batch-get-image --repository-name "$repository" \
              --image-ids imageTag="$SOURCE_SHA" \
              --query 'images[0].imageId.imageDigest' --output text)
          else
            echo '::error::ECR returned an invalid existing image digest.'
            exit 1
          fi

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::ECR did not return an exact sha256 image digest.'
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Verify the registry artefact, not only the local build flag. This also
      # covers the idempotent retry path where the SHA tag already existed.
      - name: Verify the published registry artefact
        env:
          APP: ${{ matrix.app }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          repository="oxy/$APP"
          manifest=$(aws ecr batch-get-image --repository-name "$repository" \
            --image-ids imageDigest="$DIGEST" \
            --query 'images[0].imageManifest' --output text)
          config_digest=$(MANIFEST="$manifest" python3 - <<'PY'
          import json
          import os

          print(json.loads(os.environ["MANIFEST"])["config"]["digest"])
          PY
          )
          config_url=$(aws ecr get-download-url-for-layer --repository-name "$repository" \
            --layer-digest "$config_digest" --query downloadUrl --output text)
          read -r architecture revision < <(curl -fsS "$config_url" | python3 -c '
          import json
          import sys

          image = json.load(sys.stdin)
          labels = image.get("config", {}).get("Labels") or {}
          print(image.get("architecture", "missing"), labels.get("org.opencontainers.image.revision", "missing"))
          ')
          if [ "$architecture" != "arm64" ]; then
            echo "::error::published image architecture is $architecture, expected arm64"
            exit 1
          fi
          if [ "$revision" != "$SOURCE_SHA" ]; then
            echo '::error::published image is not labelled for the exact source commit'
            exit 1
          fi
          printf -- '- `%s` -> `%s@%s` (`linux/arm64`)\n' \
            "$SOURCE_SHA" "$ECR_REGISTRY/$repository" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      # No ECS update-service, task-definition registration, desired-count
      # mutation, SSM write, or traffic probe belongs in an artefact publisher.
      # Activation is a later reviewed oxy-infra change using the digest above.
