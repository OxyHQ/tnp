# Typecheck and test every workspace.
#
# Before this existed, nothing in CI ran either — `AGENTS.md` claimed a
# `packages/client` typecheck gate that did not exist, and `apps/api`,
# `apps/relay` and `apps/dns-server` had no typecheck script at all. That is how
# `apps/dns-server` came to build a `TnpConfig` with 5 of its 18 required fields
# and ship (docs/architecture/audit-2026-08-06.md, finding B1).
#
# Both root scripts fan out with `bun run --filter '*'`, which exits non-zero if
# any workspace fails — verified by mutation-testing a type error into
# `apps/relay` and a failing assertion into `packages/protocol`, and confirming
# each turned the whole run red.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --cpu / --os fetch the platform-gated optional dependencies
      # (@opentui/core native binaries) that packages/client imports.
      - name: Install dependencies
        run: bun install --frozen-lockfile --cpu='*' --os='*'

      - name: Typecheck
        run: bun run typecheck

      # AGENTS.md is prepended to EVERY agent session, so its bytes are paid on
      # every task forever, and it grows by accretion — one reasonable paragraph
      # at a time, invisible per-commit. Nothing breaks when it grows, which is
      # why a gate rather than a convention. Reads the tracked file listing only.
      - name: Guard the AGENTS.md budget
        run: bun run validate:agents-md

      - name: Test
        run: bun run test

  # Both AWS images consume the monorepo workspace graph. A missing manifest or
  # source COPY is invisible to TypeScript and unit tests, so both Dockerfiles
  # are built before either can be published. Relay is deliberately absent: its
  # security blockers are recorded in docs/architecture/relays.md.
  docker:
    name: AWS images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the API image
        run: docker build -f Dockerfile.api -t tnp-api:ci .

      - name: Build the DNS image
        run: docker build -f Dockerfile.dns -t tnp-dns:ci .

      - name: Start it against a throwaway PostgreSQL and check it answers
        run: |
          set -euo pipefail
          docker network create tnp-ci
          docker run -d --name pg --network tnp-ci \
            -e POSTGRES_USER=tnp -e POSTGRES_PASSWORD=tnp -e POSTGRES_DB=tnp postgres:17

          for i in $(seq 1 30); do
            docker exec pg pg_isready -U tnp >/dev/null 2>&1 && break
            [ "$i" -eq 30 ] && { echo "::error::Postgres never became ready"; exit 1; }
            sleep 1
          done

          # The image runs its own migrations at startup, so this also proves the
          # migration files in drizzle/ actually apply to an empty database —
          # a schema that only exists in TypeScript would pass every unit test.
          docker run -d --name api --network tnp-ci -p 8080:8080 \
            -e DATABASE_URL=postgres://tnp:tnp@pg:5432/tnp \
            -e TNP_PARKING_IP=203.0.113.10 \
            tnp-api:ci

          # A container that starts and then dies looks identical to one that is
          # still booting, so poll for a real answer rather than sleeping.
          for i in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "API answered after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::API did not answer /health within 30s"
              docker logs api
              exit 1
            fi
            sleep 1
          done

          # The namespace policy has to hold in the built image, not only in the
          # test suite: a reserved TLD must not appear in the table clients cache.
          tlds=$(curl -fsS -m 5 http://127.0.0.1:8080/dns/tlds)
          echo "policy table: $tlds"
          if printf '%s' "$tlds" | grep -qE '"(com|app|net|org|dev)"'; then
            echo "::error::A reserved TLD is being published to clients"
            exit 1
          fi
          # And the seed ran, so an empty table cannot pass the check above by
          # containing nothing at all.
          if ! printf '%s' "$tlds" | grep -q '"ox"'; then
            echo "::error::The policy table is missing .ox — the seed did not run"
            docker logs api
            exit 1
          fi

  # Publish only after BOTH gates pass, on a push to main. The reusable workflow
  # only writes immutable API/DNS images; it cannot roll out or scale ECS.
  publish_aws_images:
    needs: [verify, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-aws.yml
    permissions:
      id-token: write
      contents: read
