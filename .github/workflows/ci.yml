# Typecheck and test every workspace.
#
# Before this existed, nothing in CI ran either — `AGENTS.md` claimed a
# `packages/client` typecheck gate that did not exist, and `apps/api`,
# `apps/relay` and `apps/dns-server` had no typecheck script at all. That is how
# `apps/dns-server` came to build a `TnpConfig` with 5 of its 18 required fields
# and ship (docs/architecture/audit-2026-08-06.md, finding B1).
#
# Both root scripts fan out with `bun run --filter '*'`, which exits non-zero if
# any workspace fails — verified by mutation-testing a type error into
# `apps/relay` and a failing assertion into `packages/protocol`, and confirming
# each turned the whole run red.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request supersedes the run still testing the old head,
# so that run is cancelled. Nothing else is ever cancelled or queued: a push to
# main gets a group of its own through the run id, since a shared group would
# still let a newer pending run replace an older pending one even with
# cancel-in-progress off.
# Cancelling a main run would also cancel publish_aws_images, which needs it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The org shares one 20-job Actions concurrency cap across every repository,
  # so a pull request runs the PostgreSQL suite and the image builds only when
  # it touches their inputs. Typecheck, lint and unit tests always run.
  #
  # Both gated jobs are required checks, and a SKIPPED required check counts
  # as passing, so a skip is decided only by a `changes` job that SUCCEEDED and
  # said that area did not change. If `changes` fails, or the event is not a
  # pull request (a push to main skips `changes`), every job runs: the push to
  # main is the only test of the merged result. Never replace this with a
  # workflow-level `paths:` filter: a required check whose workflow never
  # starts stays pending forever.
  changes:
    name: Detect affected areas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      database: ${{ steps.filter.outputs.database == 'true' || steps.filter.outputs.shared == 'true' }}
      docker: ${{ steps.filter.outputs.docker == 'true' || steps.filter.outputs.shared == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # shared: the install graph (every workspace manifest is copied into
          # every image and resolved by every install) and this workflow.
          # database: apps/api and the workspace packages it imports.
          # docker: everything the three Dockerfiles COPY, plus the
          # reviewed-image pin and gate the job checks.
          filters: |
            shared:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'apps/*/package.json'
              - 'packages/*/package.json'
            database:
              - 'apps/api/**'
              - 'packages/crypto/**'
              - 'packages/namespace/**'
              - 'packages/protocol/**'
              - 'packages/shared-types/**'
            docker:
              - 'Dockerfile*'
              - '.dockerignore'
              - '**/*.dockerignore'
              - '.github/scripts/**'
              - 'apps/api/**'
              - 'apps/dns-server/**'
              - 'apps/relay/**'
              - 'packages/**'

  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # --cpu / --os fetch the platform-gated optional dependencies
      # (@opentui/core native binaries) that packages/client imports.
      - name: Install dependencies
        run: bun install --frozen-lockfile --cpu='*' --os='*'

      # Formatting and lint for every workspace, from the root biome.json.
      - name: Lint and format check (Biome)
        run: bunx biome ci .

      - name: Typecheck
        run: bun run typecheck

      # Every Oxy app shares one Postgres: a new migration may not hold a lock
      # that stalls a hot table (NOT VALID constraints validated later, hot-table
      # DDL alone in its migration). The rules are @oxy.so/db's; the baseline and
      # hot tables are in apps/api's db:check-locks script.
      - name: Verify every new migration keeps its locks short
        run: bun run --cwd apps/api db:check-locks

      # AGENTS.md is prepended to EVERY agent session, so its bytes are paid on
      # every task forever, and it grows by accretion — one reasonable paragraph
      # at a time, invisible per-commit. Nothing breaks when it grows, which is
      # why a gate rather than a convention. Reads the tracked file listing only.
      - name: Guard the AGENTS.md budget
        run: bun run validate:agents-md

      # TNP Network must never depend on the optional services layer
      # (docs/architecture/services.md §2). Checked on parsed imports, with its
      # own mutation self-test.
      - name: Guard the services-layer import boundary
        run: bun run validate:boundaries

      - name: Test
        run: bun run test

  # Constraints, locks and ON CONFLICT are server behaviour, so these tests run
  # against a real PostgreSQL. Each test file migrates its own database from
  # empty and drops it afterwards (apps/api/test-db/harness.ts). The command
  # fails when TEST_DATABASE_URL is missing rather than skipping.
  database:
    name: PostgreSQL integration tests
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.database == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tnp
          POSTGRES_PASSWORD: tnp
          POSTGRES_DB: tnp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tnp"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --cpu='*' --os='*'

      - name: Test against PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://tnp:tnp@127.0.0.1:5432/postgres
        run: bun run test:db

  # Every AWS image consumes the monorepo workspace graph. A missing manifest or
  # source COPY is invisible to TypeScript and unit tests, so every Dockerfile
  # is built (and started) before any can be published.
  docker:
    name: AWS images build
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Only a push to main writes the layer cache; pull requests read it.
      WRITE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The production image's build inputs (Dockerfile, context, target and
      # both .dockerignore files) must match the reviewed pin in
      # .github/scripts/reviewed-images.json. The publish refuses to build on a
      # mismatch, so catching it here, on every pull request, is what stops a
      # merge from stranding main unpublishable. The fixture tests run first so
      # a green check means the gate can fail.
      - name: Prove the reviewed-image gate can fail
        run: python3 -B -m unittest discover -s .github/scripts -p test_reviewed_image.py
      - name: Verify the production image's build inputs are reviewed
        run: python3 -B .github/scripts/reviewed-image.py check

      # Builds reuse layers from the GitHub Actions cache. The ci-* scopes are
      # this job's own (linux/amd64; the publisher's arm64 scopes would never
      # match) and are written only by a push to main, so pull-request code
      # never writes a cache main reads. --load puts each image in the local
      # store under the same tag the steps below run.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # `type=gha` needs the Actions runtime token and cache URL, which GitHub
      # gives to JavaScript actions and NOT to `run:` steps; without them buildx
      # skips the cache silently.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build the API image
        run: >-
          docker buildx build -f Dockerfile.api -t tnp-api:ci --load
          --cache-from type=gha,scope=ci-tnp-api
          ${WRITE_CACHE:+--cache-to type=gha,scope=ci-tnp-api,mode=max} .

      - name: Build the DNS image
        run: >-
          docker buildx build -f Dockerfile.dns -t tnp-dns:ci --load
          --cache-from type=gha,scope=ci-tnp-dns
          ${WRITE_CACHE:+--cache-to type=gha,scope=ci-tnp-dns,mode=max} .

      - name: Build the relay image
        run: >-
          docker buildx build -f Dockerfile.relay -t tnp-relay:ci --load
          --cache-from type=gha,scope=ci-tnp-relay
          ${WRITE_CACHE:+--cache-to type=gha,scope=ci-tnp-relay,mode=max} .

      # The relay's identity is its key: start the image with a throwaway seed
      # and prove, from inside the running container, that it answers a client
      # HELLO with a proof over RELAY_ENDPOINT by that seed's public key — what
      # every client checks against the signed directory. Also: it refuses to
      # start without a seed, it is not root, and its code is not writable.
      - name: Start the relay and check it proves its key
        run: |
          set -euo pipefail
          seed=$(openssl rand -base64 32)
          endpoint=wss://relay.ci.invalid

          if docker run --rm -e RELAY_ENDPOINT="$endpoint" tnp-relay:ci \
              bun apps/relay/src/index.ts --check-config >/dev/null 2>&1; then
            echo "::error::The relay accepted a configuration without RELAY_KEY_SEED"
            exit 1
          fi
          docker run --rm -e RELAY_ENDPOINT="$endpoint" -e RELAY_KEY_SEED="$seed" tnp-relay:ci \
            bun apps/relay/src/index.ts --check-config

          docker run -d --name relay -p 8081:8080 \
            -e RELAY_ENDPOINT="$endpoint" -e RELAY_KEY_SEED="$seed" tnp-relay:ci
          for i in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:8081/health >/dev/null 2>&1; then
              echo "Relay answered after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Relay did not answer /health within 30s"
              docker logs relay
              exit 1
            fi
            sleep 1
          done

          docker exec relay bun apps/relay/src/self-test.ts

          uid=$(docker exec relay id -u)
          echo "relay uid: $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::The relay container runs as root"
            exit 1
          fi
          for path in /app /app/apps/relay/src /app/apps/relay/src/index.ts /app/node_modules; do
            if docker exec relay test -w "$path"; then
              echo "::error::$path is writable by the relay process"
              exit 1
            fi
          done
          for pkg in typescript drizzle-kit @biomejs/biome bun-types react-native vite; do
            if docker exec relay test -e "/app/node_modules/$pkg"; then
              echo "::error::$pkg is installed in the relay image"
              exit 1
            fi
          done

      - name: Start it against a throwaway PostgreSQL and check it answers
        run: |
          set -euo pipefail
          docker network create tnp-ci
          docker run -d --name pg --network tnp-ci \
            -e POSTGRES_USER=tnp -e POSTGRES_PASSWORD=tnp -e POSTGRES_DB=tnp postgres:17

          for i in $(seq 1 30); do
            docker exec pg pg_isready -U tnp >/dev/null 2>&1 && break
            [ "$i" -eq 30 ] && { echo "::error::Postgres never became ready"; exit 1; }
            sleep 1
          done

          # The image runs its own migrations at startup, so this also proves the
          # migration files in drizzle/ actually apply to an empty database —
          # a schema that only exists in TypeScript would pass every unit test.
          docker run -d --name api --network tnp-ci -p 8080:8080 \
            -e DATABASE_URL=postgres://tnp:tnp@pg:5432/tnp \
            -e TNP_PARKING_IP=203.0.113.10 \
            tnp-api:ci

          # A container that starts and then dies looks identical to one that is
          # still booting, so poll for a real answer rather than sleeping.
          for i in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "API answered after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::API did not answer /health within 30s"
              docker logs api
              exit 1
            fi
            sleep 1
          done

          # Liveness alone proves the process is up. Readiness proves the image
          # reaches its database: /health/ready runs `select 1` and answers 503
          # when it cannot, so a 200 here is the pool, not the event loop.
          for i in $(seq 1 30); do
            code=$(curl -sS -m 5 -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:8080/health/ready || true)
            if [ "$code" = "200" ]; then
              echo "API ready after ${i}s: $(cat /tmp/ready.json)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::API never reported ready (last status: ${code})"
              docker logs api
              exit 1
            fi
            sleep 1
          done

          # The API runs unprivileged and cannot rewrite itself: the process is
          # not uid 0, and its code and node_modules are root-owned and not
          # writable by it. Checked in the running container, so a base image
          # without the `bun` user or a COPY --chown fails here.
          uid=$(docker exec api id -u)
          echo "API uid: $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::The API container runs as root"
            exit 1
          fi
          for path in /app /app/apps/api/src /app/apps/api/src/index.ts /app/node_modules /app/node_modules/express; do
            if docker exec api test -w "$path"; then
              echo "::error::$path is writable by the API process"
              exit 1
            fi
          done

          # Production dependencies only: no devDependency, and none of the web
          # app's React Native tree, is installed in the API image.
          for pkg in typescript drizzle-kit @biomejs/biome bun-types react-native vite; do
            if docker exec api test -e "/app/node_modules/$pkg"; then
              echo "::error::$pkg is installed in the API image"
              exit 1
            fi
          done

          # The namespace policy has to hold in the built image, not only in the
          # test suite: a reserved TLD must not appear in the table clients cache.
          tlds=$(curl -fsS -m 5 http://127.0.0.1:8080/dns/tlds)
          echo "policy table: $tlds"
          if printf '%s' "$tlds" | grep -qE '"(com|app|net|org|dev)"'; then
            echo "::error::A reserved TLD is being published to clients"
            exit 1
          fi
          # And the seed ran, so an empty table cannot pass the check above by
          # containing nothing at all.
          if ! printf '%s' "$tlds" | grep -q '"ox"'; then
            echo "::error::The policy table is missing .ox — the seed did not run"
            docker logs api
            exit 1
          fi

          # The image above started with no TNP_SERVICES_* flag, no provider
          # account and no Namecheap variable. The network answered, and the
          # services layer must report itself off and unpurchasable.
          status=$(curl -fsS -m 5 http://127.0.0.1:8080/services/status)
          echo "services: $status"
          if ! printf '%s' "$status" | grep -q '"catalog":false'; then
            echo "::error::The services catalog is on without being enabled"
            exit 1
          fi
          if ! printf '%s' "$status" | grep -q '"purchasable":false'; then
            echo "::error::Something is purchasable without an approved payment mechanism"
            exit 1
          fi

          # Without TNP_SERVICES_WORKER the worker must refuse to run rather
          # than start polling providers.
          worker=$(docker run --rm --network tnp-ci \
            -e DATABASE_URL=postgres://tnp:tnp@pg:5432/tnp \
            tnp-api:ci bun apps/api/src/workers/commerce.ts)
          echo "worker: $worker"
          if ! printf '%s' "$worker" | grep -q '"event":"worker.disabled"'; then
            echo "::error::The services worker did not stay disabled with every flag off"
            exit 1
          fi

  # Publish only after EVERY gate passes, on a push to main. The reusable workflow
  # only writes immutable API/DNS/relay images; it cannot roll out or scale ECS.
  # On a push `changes` is skipped and every gate runs. That skipped ancestor
  # would make the implicit success() skip this job too, so each gate's result
  # is required explicitly instead: all three must be a real success, never a
  # skip. (No timeout-minutes: a reusable-workflow call cannot take one; each
  # of its jobs sets its own.)
  publish_aws_images:
    needs: [verify, database, docker]
    if: >-
      ${{ !cancelled() && vars.OXY_1519_ROLLOUT_HOLD != 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main')
      && needs.verify.result == 'success' && needs.database.result == 'success' && needs.docker.result == 'success' }}
    uses: ./.github/workflows/deploy-aws.yml
    permissions:
      id-token: write
      contents: read
