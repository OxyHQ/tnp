name: Refresh image build cache

# Weekly, rebuild the production images with NO cache and write the fresh layers
# into the GitHub Actions cache scopes deploy-aws.yml reads, so the deploy's cached
# layers stop pinning an old `apt-get`/`apk` result and pick up OS security
# patches. Builds only: no AWS credentials, no push, no deploy. It runs on main
# (schedule or a dispatch from main) and writes main's cache.
# OxyHQ/oxy .github/workflows/refresh-app-image-cache.yml.

on:
  schedule:
    - cron: '17 4 * * 5'
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-image-cache
  cancel-in-progress: false

jobs:
  rebuild:
    permissions:
      contents: read
    uses: OxyHQ/oxy/.github/workflows/refresh-app-image-cache.yml@main
    with:
      targets: >-
        [
          {"name": "tnp-api", "scope": "tnp-api", "dockerfile": "Dockerfile.api"},
          {"name": "tnp-dns", "scope": "tnp-dns", "dockerfile": "Dockerfile.dns"}
        ]
